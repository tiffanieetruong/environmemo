:root{
  --bg:#F5FFE2; --surface:#FFFFFD; --pill:rgba(227,249,185,.64); --pill-solid:#EDFAD4;
  --ink:#0A3600; --ink-2:rgba(10,54,0,.72); --ink-3:rgba(10,54,0,.5); --black:#000;
  --brand:#5A8900; --accent:#7EA730; --accent-ink:#FFFFFF; --line:#A9D359; --line-dark:#0A3600;
  --track:#D9D9D9; --icon-bg:#E3F9B9; --badge-bg:#DDF6FF; --heart:#E5484D; --ph:#D0D0D0;
  --scrim:rgba(70,70,70,.43); --shadow:4px 6px 6.5px rgba(0,0,0,.25); --shadow-sm:1px 2px 4.8px rgba(0,0,0,.25);
  --t-all:#DEFF9E; --t-noticing:#CDEEFF; --t-memory:#FFC4C4; --t-photo:#EBD3FF; --t-fact:#CEFFDC; --t-history:#DEFF9E; --t-rec:#FFF9BB; --t-question:#FFE0C2;
  --c-plant:#7EA730; --c-landmark:#9C88B8; --c-food:#F2B632; --c-hangout:#3FA7A8; --c-utility:#4F8FD1; --c-art:#E07A9A;
  --m-ground:#E6F5CC; --m-lawn:#D2ECA6; --m-road:#FFFFFF; --m-road-edge:#DCEBC4; --m-bldg:#D9D9D3; --m-bldg-top:#EEEEEA; --m-tree:#B3DB84; --m-tree-2:#9DCC6A; --m-water:#BEE3F0;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:"Seurat","Hiragino Maru Gothic ProN","Arial Rounded MT Bold",system-ui,sans-serif;font-weight:400;font-synthesis:none;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:10px}
img{max-width:100%;display:block}
#app{height:100%;display:flex;flex-direction:column;max-width:480px;margin:0 auto;background:var(--bg);position:relative;overflow:hidden}

/* header */
.top{display:flex;align-items:center;gap:10px;padding:14px 18px 12px 21px;background:var(--bg);flex:none}
.brand{font-family:"KiwiSoda","Seurat",sans-serif;font-size:24px;color:var(--brand);margin-right:auto;line-height:1;letter-spacing:.01em}
.iconbtn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:var(--ink);position:relative;flex:none}
.iconbtn:active{background:var(--pill)}
.dot{position:absolute;top:4px;right:3px;min-width:17px;height:17px;border-radius:9px;background:var(--heart);color:#fff;font-size:10px;display:grid;place-items:center;padding:0 4px;line-height:1}
.dot.g{background:var(--accent)}
.screenhead{display:flex;align-items:center;gap:6px;padding:12px 14px 6px;flex:none;position:relative;min-height:62px}
.screenhead h1{font-size:21px}
.screenhead.center h1{position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap}

main{flex:1;overflow-y:auto;overflow-x:hidden;position:relative}
.pad{padding:8px 14px 28px}

/* nav (Figma: 402x105, white, 20 top radius, active pill 81x77 r15) */
.tabs{flex:none;display:flex;justify-content:space-around;background:var(--surface);border-radius:20px 20px 0 0;padding:12px 10px 12px;box-shadow:0 -1px 0 rgba(10,54,0,.06)}
.tab{flex:1;max-width:81px;height:70px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:12px;color:var(--ink);border-radius:15px}
.tabs{position:relative}
.tab{position:relative;z-index:1}
.tabpill{position:absolute;top:12px;left:0;width:81px;height:70px;border-radius:15px;background:var(--pill);z-index:0;pointer-events:none;transition:transform .34s cubic-bezier(.3,.8,.25,1),width .34s cubic-bezier(.3,.8,.25,1)}
@keyframes inR{from{transform:translateX(24%);opacity:0}to{transform:none;opacity:1}}
@keyframes inL{from{transform:translateX(-24%);opacity:0}to{transform:none;opacity:1}}
.slide-r{animation:inR .3s cubic-bezier(.3,.8,.25,1)}
.slide-l{animation:inL .3s cubic-bezier(.3,.8,.25,1)}
@keyframes layerIn{from{transform:translateX(100%)}to{transform:none}}
@keyframes layerOut{from{transform:none}to{transform:translateX(100%)}}
.layer.enter{animation:layerIn .32s cubic-bezier(.3,.8,.25,1)}
.layer.leave{animation:layerOut .24s ease-in forwards}

/* map */
.mapwrap{position:absolute;inset:0;background:var(--m-ground);display:flex;flex-direction:column}
.maphud{flex:none;padding:8px 14px 6px;display:flex;flex-wrap:wrap;gap:8px;background:var(--bg)}
.hudchip{background:var(--surface);border-radius:30px;padding:7px 14px;box-shadow:var(--shadow-sm);font-size:12px;display:flex;align-items:center;gap:10px;color:var(--ink)}
.bar{height:11px;border-radius:10px;background:var(--track);overflow:hidden;flex:1;min-width:60px}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:10px;transition:width .4s}
.hudchip .bar{height:7px;min-width:70px}
.mapsvg{flex:1;width:100%;height:100%;display:block;touch-action:manipulation}
.edge{position:absolute;font-size:10px;color:var(--ink);background:var(--surface);padding:3px 10px;border-radius:30px;box-shadow:var(--shadow-sm);z-index:1;pointer-events:none;white-space:nowrap;opacity:.92}
.edge.t{top:6px;left:50%;transform:translateX(-50%)}
.edge.b{bottom:8px;left:50%;transform:translateX(-50%)}
.edge.l{left:13px;top:50%;transform:translate(-50%,-50%) rotate(-90deg)}
.edge.r{right:13px;top:50%;transform:translate(50%,-50%) rotate(90deg)}
.placebar{position:absolute;left:12px;right:12px;top:10px;z-index:3;display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--bg);border-radius:15px;padding:10px 10px 10px 16px;box-shadow:var(--shadow-sm);font-size:14px}
.placebar span{flex:1}
.placebar button{background:var(--bg);color:var(--ink);border-radius:30px;padding:7px 14px;font-size:13px}
#mapsvg.placing{cursor:crosshair}
.addopt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--accent);border-radius:15px;padding:14px}
.addopt+.addopt{margin-top:12px}
.addopt .iconcircle{width:58px;height:58px;flex:none}
.addopt b{display:block;font-weight:400;font-size:17px}
.addopt span.tiny{display:block;margin-top:3px}
.addopt[disabled]{opacity:.5}
.spotrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 4px;border-bottom:1px solid var(--line)}

.lb.me{background:var(--pill);border-radius:12px;padding-left:6px;padding-right:6px}

@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.fadein{animation:fadein .28s ease-out}
.chip[disabled]{opacity:.4}
.feedbar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.miniseg.big{display:flex}

.filterbtn{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:30px;padding:6px 14px;font-size:13px}

.fcount{min-width:18px;height:18px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:10px;display:grid;place-items:center;padding:0 5px}
.tagpick{display:flex;flex-wrap:wrap;gap:10px}

.acctlist{display:flex;flex-direction:column;gap:12px}
.acct{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--accent);border-radius:15px;padding:10px 8px 10px 12px}

.acctmain{flex:1;display:flex;align-items:center;gap:14px;text-align:left;color:var(--ink);min-width:0}
.actlist{margin-top:14px}
.actrow{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--accent);border-radius:15px;padding:10px 8px 10px 14px;margin-bottom:10px}
.actmain{flex:1;min-width:0;text-align:left;color:var(--ink)}
.actmain p:first-child{overflow-wrap:anywhere}

.actempty{margin:4px 4px 0}
.ptile{position:relative;border-radius:15px;overflow:hidden}
.ptile img{width:100%;height:100%;object-fit:cover}
.pdel{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;background:rgba(10,54,0,.72);color:#fff;display:grid;place-items:center}
.pfirst{position:absolute;left:6px;bottom:6px;background:rgba(10,54,0,.72);color:#fff;border-radius:20px;padding:2px 8px;font-size:10px}
.gallery{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;margin-top:12px;border-radius:12px;scrollbar-width:none}

@keyframes vin{from{opacity:0}to{opacity:1}}

.vcount{font-size:14px;white-space:nowrap}

.vslide img{width:100%;height:100%;object-fit:contain}

.vdots{display:flex;justify-content:center;gap:7px;padding:12px 0 18px}
.vdots span{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.35);transition:background .2s,transform .2s}
.vdots span.on{background:#fff;transform:scale(1.2)}
.zoomctl{position:absolute;right:23px;bottom:150px;z-index:2;display:flex;flex-direction:column;gap:6px}
.zoomctl button{width:36px;height:36px;border-radius:50%;background:var(--surface);color:var(--ink);display:grid;place-items:center;box-shadow:var(--shadow-sm)}
.zoomctl button[hidden]{display:none}
#mapsvg{touch-action:none;cursor:grab}
#mapsvg:active{cursor:grabbing}
.fab{position:absolute;right:17px;bottom:12px;width:60px;height:60px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;z-index:2;box-shadow:var(--shadow-sm)}
.pin{cursor:pointer}
.pin .lblbg{fill:var(--surface);filter:drop-shadow(1px 2px 2.4px rgba(0,0,0,.25))}
.pin .lbl{font-size:9.5px;fill:var(--black);font-family:"Seurat",sans-serif}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.pin.fresh>g.body{animation:pop .5s ease-out;transform-box:fill-box;transform-origin:50% 100%}

/* type */
h1,h2,h3{margin:0;font-weight:400;line-height:1.15}
h1{font-size:24px}
h2{font-size:19px}
h3{font-size:17px}
p{margin:0}
.muted{color:var(--ink-2)}
.green{color:var(--accent)}
.small{font-size:12px}
.tiny{font-size:10px}
.stack>*+*{margin-top:14px}
.row{display:flex;align-items:center;gap:10px}
.spacer{flex:1}

/* controls */
.card{background:var(--surface);border:1px solid var(--accent);border-radius:15px;padding:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 22px;border-radius:15px;font-size:16px;background:var(--accent);color:var(--accent-ink)}
.btn.block{display:flex;width:100%}
.btn.ghost{background:var(--surface);color:var(--ink);border:1.5px solid var(--line)}
.btn.soft{background:var(--pill);color:var(--ink);border:1.5px solid var(--line)}
.btn.sm{min-height:36px;padding:0 14px;border-radius:30px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.pilltabs{display:flex;gap:16px;justify-content:space-between}
.pilltabs button{flex:1;height:42px;border-radius:30px;border:2px solid var(--accent);background:rgba(255,255,255,.64);font-size:17px;color:var(--ink)}
.pilltabs button[aria-pressed="true"]{background:var(--pill)}
label.f,.flabel{display:block;font-size:17px;margin-bottom:8px;color:var(--ink)}
.hint{font-size:11px;color:var(--ink-2);margin-top:5px}
.field{width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:15px;padding:14px 16px;font-size:15px;color:var(--ink)}
.field:focus{outline:none;border-color:var(--accent)}
.field::placeholder,.dash textarea::placeholder{color:var(--accent);opacity:.85}
.locfield{display:flex;align-items:center;gap:12px;background:var(--pill);border:1.5px solid var(--line-dark);border-radius:15px;padding:0 18px;min-height:71px;font-size:19px}
.locfield input{flex:1;border:0;background:transparent;font-size:19px;color:var(--ink);min-width:0}
.locfield input:focus{outline:none}
.locfield input::placeholder{color:var(--ink-3)}
.dash{border:1.5px dashed var(--line);border-radius:15px;background:var(--surface);position:relative}
.dash textarea{width:100%;min-height:150px;border:0;background:transparent;resize:none;padding:16px 16px 30px;font-size:15px;color:var(--ink)}
.dash textarea:focus{outline:none}
.dash .count{position:absolute;right:16px;bottom:10px;font-size:11px;color:var(--accent)}
.phototiles{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.phototiles>*{aspect-ratio:180/157;border-radius:15px;overflow:hidden}
.phototiles img{width:100%;height:100%;object-fit:cover}
.addphoto{border:1.5px dashed var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--accent);font-size:16px}
.picker{position:relative;display:flex;align-items:center;gap:15px;background:var(--surface);border:1.5px solid var(--line);border-radius:15px;padding:10px 18px 10px 12px;min-height:71px;font-size:19px}
.picker .ico{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;flex:none;color:var(--ink)}
.picker select{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer;font-size:16px}
.picker .caret{margin-left:auto;color:var(--ink)}
.err{color:var(--heart);font-size:12px;margin-top:6px;min-height:1em}
.chiprow{display:flex;gap:11px;overflow-x:auto;padding:2px 2px 6px;margin:0 -2px;scrollbar-width:none}
.chiprow::-webkit-scrollbar{display:none}
.chip{flex:none;min-width:58px;max-width:78px;height:62px;padding:6px 8px;border-radius:10px;font-size:10px;line-height:1.1;text-align:center;color:var(--black);border:1.5px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}
.chip svg{flex:none}
.chip{transition:transform .2s,border-color .2s}
.chip[aria-pressed="true"]{border-color:var(--line-dark);transform:translateY(-2px)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.tag{display:inline-block;border-radius:8px;padding:2px 8px;font-size:10px;color:var(--black)}

/* onboarding (Figma: username screen) */
.splashmid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none}
.onb.dark{background:#0A3600;color:#FFFFFD}
.onb.dark .brandbig{color:#97E01C;text-align:center;font-size:clamp(46px,16.5vw,68px);line-height:1}
.onb.dark .tagline{color:#DEFF9E;text-align:center;font-size:13px;line-height:1.6;margin-top:16px}
.onb.dark .flabel{color:#FFFFFD;font-size:17px}
.onb.dark .hint{color:#DEFF9E;font-size:10px}
.onb.dark .err{color:#FFB4A8}
.onb.dark .field{border:3px solid #DEFF9E;font-size:17px;padding:13px 16px;color:#0A3600;background:#FFFFFD}
.onb.dark .field::placeholder{color:#55703F}
.onb.dark .btn{background:#DEFF9E;color:#0A3600;font-size:17px;min-height:48px}
.onb.dark .muted{color:rgba(255,255,253,.8)}
.onb.dark .steps li{border-bottom-color:rgba(178,235,87,.35)}
.onb.dark .steps li::before{background:#DEFF9E;color:#0A3600}
.onb.dark .roommap{color:rgba(255,255,253,.8)}
.onb.dark .roommap .box{background:#E6F5CC;border-color:#B2EB57;color:#0A3600}
@keyframes onbIn{from{transform:translateX(100%)}to{transform:none}}
@keyframes curtain{0%{transform:none}100%{transform:translateY(-104%)}}
@keyframes rise{from{transform:translateY(18px);opacity:0}to{transform:none;opacity:1}}
@keyframes arrive{from{transform:scale(.94);opacity:.3}to{transform:none;opacity:1}}
.onb.enter{animation:onbIn .38s cubic-bezier(.3,.8,.25,1)}
.onb.leave{animation:curtain .62s cubic-bezier(.65,0,.3,1) forwards;box-shadow:0 18px 30px rgba(10,54,0,.35)}
.onb.first .brandbig{animation:rise .6s cubic-bezier(.3,.8,.25,1) both}
.onb.first .tagline{animation:rise .6s .12s cubic-bezier(.3,.8,.25,1) both}
.onb.first .onb-body{animation:rise .6s .24s cubic-bezier(.3,.8,.25,1) both}
#app.arrive #view,#app.arrive #top,#app.arrive #tabs{animation:arrive .6s .15s cubic-bezier(.3,.8,.25,1) both}
.mapsvg.arrive .pin>g.body{animation:pop .45s cubic-bezier(.3,.8,.25,1) both;animation-delay:calc(var(--i,0)*80ms + .55s);transform-box:fill-box;transform-origin:50% 100%}
.mapsvg.arrive .pin .lblbg,.mapsvg.arrive .pin .lbl{animation:rise .35s both;animation-delay:calc(var(--i,0)*80ms + .75s)}
.avpick{position:relative;width:158px;height:158px;margin:0 auto;display:block;border-radius:50%}
.avpick .face{width:158px;height:158px;border-radius:50%;background:#D9DBE0;display:grid;place-items:center;overflow:hidden}
.avpick .face img{width:100%;height:100%;object-fit:cover}
.avpick .pencil{position:absolute;top:12px;right:-6px;width:40px;height:40px;border-radius:50%;background:#FFFFFD;color:#0A3600;display:grid;place-items:center;border:1.5px solid #0A3600}

.onb{position:absolute;inset:0;z-index:50;background:var(--bg);overflow-y:auto;display:flex;flex-direction:column}
.onb-hero{padding:56px 24px 10px}
.brandbig{font-family:"KiwiSoda","Seurat",sans-serif;font-size:46px;color:var(--brand);line-height:1}
.onb-body{padding:18px 22px 32px;flex:1;display:flex;flex-direction:column}
.steps{list-style:none;margin:0;padding:0;counter-reset:s}
.steps li{counter-increment:s;display:grid;grid-template-columns:40px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.steps li:last-child{border-bottom:0}
.steps li::before{content:counter(s);width:34px;height:34px;border-radius:50%;background:var(--icon-bg);color:var(--ink);display:grid;place-items:center;font-size:15px}
.steps b{display:block;font-weight:400;font-size:16px}
.roommap{display:grid;grid-template-columns:auto 1fr auto;grid-template-rows:auto 84px auto;gap:4px;align-items:center;justify-items:center;font-size:11px;color:var(--ink-2);margin:6px 0}
.roommap .box{width:100%;height:100%;border:2px dashed var(--accent);border-radius:15px;background:var(--m-ground);display:grid;place-items:center;color:var(--ink);font-size:13px}

/* overlays */
.scrim{position:absolute;inset:0;z-index:40;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;padding-top:env(safe-area-inset-top,0px)}
.scrim.center{align-items:center;padding:20px 16px}
.sheet{background:var(--surface);width:100%;max-height:92%;overflow-y:auto;border-radius:20px 20px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom,0px));position:relative}
.popcard{background:var(--surface);width:min(342px,100%);max-height:100%;overflow-y:auto;border-radius:20px;box-shadow:var(--shadow);position:relative}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{transform:scale(.96);opacity:.4}to{transform:none;opacity:1}}
.sheet.anim{animation:up .22s ease-out}
.popcard.anim{animation:fade .2s ease-out}
.close{position:absolute;top:16px;right:14px;width:32px;height:32px;border-radius:50%;background:var(--surface);display:grid;place-items:center;z-index:2;color:var(--ink);box-shadow:var(--shadow-sm)}
.pophero{height:220px;background:var(--pill-solid);position:relative;overflow:hidden}
.pophero img{width:100%;height:100%;object-fit:cover}

.pophero .cap{position:absolute;left:12px;bottom:10px;background:var(--surface);border-radius:30px;padding:3px 10px;font-size:10px;box-shadow:var(--shadow-sm)}
.popbody{padding:14px 19px 20px}
.catart{display:grid;place-items:center;color:#fff;width:100%;height:100%}
.lockline{display:inline-flex;align-items:center;gap:7px;font-size:14px;color:rgba(10,54,0,.75)}
.lockline svg{color:var(--line)}
.scanrow{display:flex;align-items:center;gap:18px;margin-top:16px}
.qrbubble{width:74px;height:74px;border-radius:50%;background:var(--surface);display:grid;place-items:center;flex:none;color:var(--ink);border:2px solid var(--line);box-shadow:var(--shadow-sm)}
.scanpill{flex:1;background:var(--pill);border:1px solid var(--line);border-radius:15px;padding:12px 14px;text-align:center;font-size:16px;line-height:1.5;color:var(--black)}
.viewfinder{position:relative;width:min(300px,100%);aspect-ratio:1;margin:4px auto 0;border-radius:20px;background:#0A3600;overflow:hidden;display:grid;place-items:center}
.viewfinder video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .3s}
.viewfinder.live video{opacity:1}
.viewfinder.live .vf-idle{display:none}
.vf-idle{color:#DEFF9E;opacity:.8}
.vf-c{position:absolute;width:44px;height:44px;border:4px solid #DEFF9E;z-index:1}

.vf-c.tr{top:18px;right:18px;border-left:0;border-bottom:0;border-radius:0 12px 0 0}
.vf-c.bl{bottom:18px;left:18px;border-right:0;border-top:0;border-radius:0 0 0 12px}
.vf-c.br{bottom:18px;right:18px;border-left:0;border-top:0;border-radius:0 0 12px 0}
.simrow{width:100%;min-height:58px;font-size:15px;text-align:left;padding:0 14px}
.simrow .simname{flex:1}
.simico{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;flex:none}
.linkbtn{color:var(--accent);text-decoration:underline;text-underline-offset:3px;font-size:13px}

/* landmark page */
.layer{position:absolute;inset:0;z-index:30;background:var(--bg);overflow-y:auto}

.hero::-webkit-scrollbar{display:none}

.pinbody{background:var(--surface);border-radius:25px 25px 0 0;margin-top:-37px;position:relative;padding:23px 21px 40px;min-height:60vh}
.post{display:grid;grid-template-columns:61px 1fr auto;gap:0 12px;padding:16px 0 18px;border-bottom:1px solid rgba(10,54,0,.6)}

.post .who{font-size:12px;color:var(--black);margin-top:3px}
.post .meta{font-size:9px;color:rgba(10,54,0,.66);display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:3px}
.post .meta i{width:5px;height:5px;border-radius:50%;background:var(--accent);display:inline-block}
.post .txt{margin-top:6px;font-size:12px;line-height:20px;color:var(--black);overflow-wrap:anywhere}
.post .thumb{width:76px;height:80px;border-radius:10px;object-fit:cover}
.acts{display:flex;gap:18px;margin-top:8px;flex-wrap:wrap}
.act{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--ink);min-height:30px}
.act svg{flex:none}
.act.heart svg{color:var(--heart)}
.act.on svg{fill:var(--heart)}
.act.ok{color:var(--accent)}
.replies{grid-column:2/4;margin-top:6px;border-left:3px solid var(--line);padding-left:12px}
.reply{font-size:12px;padding:5px 0;color:var(--black)}
.hidden-post{font-size:12px;color:var(--ink-3);padding:14px 0;border-bottom:1px solid var(--line)}

/* collection */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.tile{border-radius:15px;overflow:hidden;background:var(--surface);border:1px solid var(--accent);text-align:left;display:flex;flex-direction:column}
.tile .art{height:104px;display:grid;place-items:center;color:#fff;background-size:cover;background-position:center}
.tile.locked .art{background:repeating-linear-gradient(135deg,var(--pill-solid) 0 10px,var(--icon-bg) 10px 20px);color:var(--ink-3)}
.tile .cap2{padding:10px 12px}
.tile .cap2 b{display:block;font-weight:400;font-size:15px;line-height:1.2;color:var(--ink)}

/* challenges & profile */
.chal{display:grid;grid-template-columns:84px 1fr;gap:16px;align-items:center;padding:30px 14px 30px 11px}
.iconcircle{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;background:var(--icon-bg);color:var(--ink)}
.iconcircle.dim{background:var(--track);color:var(--ink-3);opacity:.7}
.chal h3{font-size:19px}
.chal .desc{font-size:10px;color:var(--accent);margin-top:4px}
.chal .prog{display:flex;align-items:center;gap:12px;margin-top:10px}
.chal .prog b{font-weight:400;font-size:11px;color:var(--black);white-space:nowrap}
.badgegrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 8px;text-align:center}
.badgec{width:87px;height:87px;border-radius:50%;display:grid;place-items:center;background:var(--badge-bg);color:var(--ink);margin:0 auto 6px}
.badgec.dim{background:var(--track);opacity:.55}
.badgegrid b{font-weight:400;font-size:15px;display:block;line-height:1.15}
.badgegrid span{font-size:10px;color:var(--accent);display:block;line-height:1.2;margin-top:2px}
.lb{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.lb:last-child{border-bottom:0}
.lb .rank{width:20px;color:var(--ink-2)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;border:1.5px solid var(--line);border-radius:15px;background:var(--surface);padding:12px 0}
.stats>*+*{border-left:1px solid var(--line)}
.stats b{display:block;font-weight:400;font-size:19px;color:var(--ink)}
.stats span{font-size:11px;color:var(--ink-2)}
.member{display:flex;align-items:center;gap:10px;padding:8px 0}
.friendspage>.card{padding:18px 18px}
.friendspage>*+*{margin-top:20px}
.friendspage>.sectionhead{margin:30px 4px 12px}
.friendspage>.sectionhead+.card{margin-top:0}
.friendspage .card h3{margin-bottom:10px!important}
.friendspage .member{padding:12px 0;gap:12px}
.friendspage .member+.member{border-top:1px solid var(--line)}
.friendspage .member .btn.sm+.btn.sm{margin-left:2px}
.friendspage .card>p{line-height:1.55}
.sectionhead{display:flex;align-items:center;justify-content:space-between;margin:22px 4px 10px}
.sectionhead h2{font-size:21px}
.seeall{display:inline-flex;align-items:center;gap:4px;color:var(--accent);font-size:16px}
.banner{background:var(--t-rec);color:var(--black);font-size:12px;padding:8px 16px;flex:none}

.toast{position:absolute;left:50%;bottom:calc(112px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:15px;font-size:14px;box-shadow:var(--shadow-sm);max-width:88%;text-align:center}

.qrgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.qrcard{border:1.5px dashed #A9D359;border-radius:15px;padding:12px;text-align:center;background:#fff;color:#0A3600}
.qrcard .q{display:grid;place-items:center;min-height:140px}
.qrcard .q img,.qrcard .q canvas{width:140px!important;height:140px!important}
.qrcard b{display:block;margin-top:8px;font-weight:400;font-size:14px}
.qrcard code{font-size:11px}
@media print{body *{visibility:hidden}.qrsheet,.qrsheet *{visibility:visible}.qrsheet{position:absolute;left:0;top:0;width:100%}.noprint{display:none!important}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

function ic(n,s=22,sw=1.7){return `<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]||''}</svg>`}

/* ---------- vocab ---------- */
/* Pins are places; what people post there are stories. Every pin looks the same. */
const STORY_PIN={label:'Stories',icon:'landmark',color:'var(--accent)'};
const PIN_CATS=new Proxy({},{get:()=>STORY_PIN});
/* Story tags: people pick up to 3, and feeds filter by them. */
const TAGS={
 heartfelt:{label:'Heartfelt',icon:'heart',bg:'var(--t-memory)'},
 firsts:{label:'First times',icon:'star',bg:'var(--t-rec)'},
 funny:{label:'Funny',icon:'smile',bg:'var(--t-question)'},
 hidden:{label:'Hidden gem',icon:'search',bg:'var(--t-noticing)'},
 history:{label:'History',icon:'landmark',bg:'var(--t-fact)'},
 advice:{label:'Advice',icon:'flag',bg:'var(--t-photo)'},
 nature:{label:'Nature',icon:'leaf',bg:'var(--t-history)'}
};
const LEGACY_TAG={memory:'heartfelt',photo:'hidden',rec:'advice',fact:'history',history:'history',question:'advice',noticing:'hidden'};
function firstSentence(t){
 t=String(t||'').replace(/\s+/g,' ').trim();if(!t)return '';
 const m=t.match(/^.+?[.!?…](?=\s|$)/);let out=m?m[0]:t;
 if(out.length>140){out=out.slice(0,130).replace(/\s+\S*$/,'')+'…'}
 return out;
}
function normStory(id,v){
 const tags=Array.isArray(v.tags)&&v.tags.length?v.tags.filter(t=>TAGS[t]):[LEGACY_TAG[v.type]||'heartfelt'];
 const photos=Array.isArray(v.photos)&&v.photos.length?v.photos.filter(Boolean):(v.photo?[v.photo]:[]);
 const teaser=photos.length&&v.teaser!=='text'?(v.teaser==='photo'||!v.teaser?'photo':'text'):'text';
 return {id,...v,photos,photo:photos[0]||null,video:null,headline:v.headline||firstSentence(v.text)||'A story',peek:firstSentence(v.text),tags,teaser};
}
/* "Give me a prompt" ideas: heartfelt first, per the class feedback. */
const PROMPTS=[
 ['The first time this place felt like mine','The first time I came here, I…'],
 ['Someone I met right here','I didn’t expect to meet anyone that day, but…'],
 ['What I was carrying the day I sat here','I remember sitting here, worrying about…'],
 ['A small kindness I got here','Someone I didn’t know…'],
 ['The night I stayed too late','It was way past midnight when…'],
 ['What I’d tell a freshman standing here','If you’re standing where I stood, here’s what I wish I’d known…'],
 ['A call home I made from this spot','I called home from right here because…'],
 ['Where I celebrated good news','I found out right here that…'],
 ['A detail almost everyone walks past','Next time you’re here, look for…'],
 ['The best and worst day here','This spot was part of both my best and worst day.'],
 ['Where I go when it’s all too much','When things get overwhelming, I come here because…'],
 ['A tradition I started here','Every week I…'],
 ['What this place sounds like at 7am','If you come early enough…'],
 ['The friend I made because of this spot','We probably wouldn’t be friends if not for…']
];
const AV_COLORS=['#7EA730','#9C88B8','#E0A21E','#3FA7A8','#4F8FD1','#E07A9A','#8A6D1E','#5A8900'];

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function newId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function safeSeg(s){return String(s).replace(/[^A-Za-z0-9_\-.~:@+]/g,'-')}
function hashStr(s){let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))|0;return Math.abs(h)}
function ago(t){if(!t)return'';const s=(Date.now()-t)/1000;if(s<60)return'just now';if(s<3600)return Math.floor(s/60)+' min ago';if(s<86400)return Math.floor(s/3600)+' h ago';const d=Math.floor(s/86400);return d===1?'yesterday':d+' days ago'}
function toast(msg,ms=2600){const t=$('#toast');t.innerHTML=`<div class="toast" role="status">${esc(msg)}</div>`;clearTimeout(toast._t);toast._t=setTimeout(()=>{t.innerHTML=''},ms)}

/* profanity filter */
const BAD_SUB=['fuck','shit','cunt','nigg','fagg','motherf','bitch','whore','slut','retard'];
const BAD_WORD=['ass','asshole','dick','cock','pussy','bastard','fag','twat','wank','prick','damn','piss','tits','douche','jackass','dumbass'];
function norm(s){return s.toLowerCase().replace(/[0]/g,'o').replace(/[1!|]/g,'i').replace(/3/g,'e').replace(/[4@]/g,'a').replace(/[5$]/g,'s').replace(/7/g,'t')}
function hasProfanity(s){if(!s)return false;const n=norm(s);const squashed=n.replace(/[^a-z]/g,'');if(BAD_SUB.some(w=>squashed.includes(w)))return true;return n.split(/[^a-z]+/).some(w=>BAD_WORD.includes(w))}

/* ---------- store: shared db with a local fallback ---------- */
const S={uid:null,me:null,isOwner:false,canWrite:null,view:'map',pin:null,page:null,modal:null,filter:'all',chalTab:'you',addForm:{},onb:null,pendingScan:null,fresh:null,seenBadges:null,ready:false};
/* Every record lives in one Supabase table, "docs": (coll, id, data jsonb).
   coll is the collection name (pins, posts, players, likes, ...), id is the record id,
   data is the record itself. Realtime pushes every change to every open phone. */
const Store={sb:null,practice:false,remote:{},local:{},data:{},loaded:{},
 loadLocal(){try{this.local=JSON.parse(localStorage.getItem('em-local')||'{}')||{}}catch(e){this.local={}}},
 saveLocal(){try{localStorage.setItem('em-local',JSON.stringify(this.local))}catch(e){toast('This phone ran out of room for photos. Try a smaller photo.')}},
 async init(){
  const c=window.EM_CONFIG||{};
  if(window.supabase&&c.supabaseUrl&&c.supabaseAnonKey&&!/YOUR-/.test(c.supabaseUrl)){
   try{this.sb=window.supabase.createClient(c.supabaseUrl,c.supabaseAnonKey,{auth:{persistSession:false}})}catch(e){this.sb=null}
  }
  if(!this.sb){this.goPractice();COLLS.forEach(k=>{this.loaded[k]=true;this.merge(k)});return}
  this.sb.channel('em-docs').on('postgres_changes',{event:'*',schema:'public',table:'docs'},p=>this.apply(p)).subscribe();
  await this.loadAll();
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')this.loadAll()});
 },
 async loadAll(){
  const out={};const page=1000;let from=0;
  try{
   for(;;){const {data,error}=await this.sb.from('docs').select('coll,id,data').range(from,from+page-1);if(error)throw error;
    data.forEach(r=>{(out[r.coll]||(out[r.coll]={}))[r.id]=r.data});if(data.length<page)break;from+=page}
   COLLS.forEach(k=>{this.remote[k]=out[k]||{};this.loaded[k]=true;this.merge(k)});
  }catch(e){console.error(e);toast('Couldn’t reach the shared map. Check your connection.');COLLS.forEach(k=>{this.loaded[k]=true;this.merge(k)})}
 },
 apply(p){
  const row=(p.new&&p.new.coll)?p.new:p.old;if(!row||!row.coll)return;
  const k=row.coll;this.remote[k]=this.remote[k]||{};
  if(p.eventType==='DELETE')delete this.remote[k][row.id];else this.remote[k][row.id]=p.new.data;
  this.merge(k);
 },
 merge(coll){this.data[coll]={...(this.remote[coll]||{}),...(this.local[coll]||{})};for(const k in this.data[coll])if(this.data[coll][k]===null)delete this.data[coll][k];schedule()},
 goPractice(){if(this.practice)return;this.practice=true;renderBanner()},
 async set(coll,id,obj){
  if(this.sb&&!this.practice){
   const {error}=await this.sb.from('docs').upsert({coll,id,data:obj,updated_at:new Date().toISOString()});
   if(error){console.error(error);throw error}
   (this.remote[coll]||(this.remote[coll]={}))[id]=obj;this.merge(coll);return;
  }
  (this.local[coll]||(this.local[coll]={}))[id]=obj;this.saveLocal();this.merge(coll);
 },
 async del(coll,id){
  if(this.sb&&!this.practice){
   const {error}=await this.sb.from('docs').delete().eq('coll',coll).eq('id',id);
   if(error){console.error(error);throw error}
   if(this.remote[coll])delete this.remote[coll][id];this.merge(coll);return;
  }
  if(this.local[coll])delete this.local[coll][id];this.saveLocal();this.merge(coll);
 }
};
const D=Store.data;
const COLLS=['config','pins','posts','players','likes','checks','replies','invites','groups','scans','friendreqs'];

/* ---------- data accessors ---------- */
const cfg=()=>(D.config&&D.config.main)||{};
const labels=()=>Object.assign({top:'North - front of class',bottom:'South - back of the class',left:'Windows',right:'Door'},cfg().labels||{});
const spareCount=()=>Number(cfg().spares)||5;
function pinsList(){return Object.entries(D.pins||{}).map(([id,v])=>({id,...v})).sort((a,b)=>(a.at||0)-(b.at||0))}
function pinById(id){const v=(D.pins||{})[id];return v?{id,...v}:null}
function postsAt(pin){return Object.entries(D.posts||{}).map(([id,v])=>normStory(id,v)).filter(p=>p.pin===pin).sort((a,b)=>(a.at||0)-(b.at||0))}
function allPosts(){return Object.entries(D.posts||{}).map(([id,v])=>normStory(id,v))}
function player(uid){if(uid===S.uid&&S.me)return S.me;return (D.players||{})[uid]||null}
function players(){const o={...(D.players||{})};if(S.uid&&S.me)o[S.uid]=S.me;return Object.entries(o).map(([id,v])=>({id,...v})).filter(p=>p.username)}
function nameOf(uid,fallback){const p=player(uid);return p&&p.username?p.username:(fallback||'someone')}
function likesOf(post){return Object.values(D.likes||{}).filter(l=>l.post===post)}
function checksOf(post){return Object.values(D.checks||{}).filter(c=>c.post===post)}
function repliesOf(post){return Object.entries(D.replies||{}).map(([id,v])=>({id,...v})).filter(r=>r.post===post).sort((a,b)=>a.at-b.at)}
function isHidden(post){return checksOf(post.id).filter(c=>c.v==='dup'&&c.uid!==post.by).length>=2}
function unlockedList(uid){const p=player(uid);return (p&&Array.isArray(p.unlocked))?p.unlocked:[]}
function isUnlocked(pin,uid=S.uid){return unlockedList(uid).some(u=>u.pin===pin)}
function groupId(){return S.me&&S.me.groupId||null}
function groupMembers(gid){if(!gid)return[];return players().filter(p=>p.groupId===gid)}
function scansFor(gid,pin){return Object.values(D.scans||{}).filter(s=>s.group===gid&&s.pin===pin).map(s=>s.uid)}
function myInvites(){return Object.entries(D.invites||{}).map(([id,v])=>({id,...v})).filter(i=>i.to===S.uid&&i.status==='pending'&&(D.groups||{})[i.group])}
function friendReqs(){return Object.entries(D.friendreqs||{}).map(([id,v])=>({id,...v}))}
function pairId(a,b){return safeSeg([a,b].sort().join('__'))}
function reqWith(uid){return (D.friendreqs||{})[pairId(S.uid,uid)]||null}
function friendIds(uid=S.uid){const s=new Set();friendReqs().forEach(r=>{if(r.status!=='accepted')return;if(r.from===uid)s.add(r.to);else if(r.to===uid)s.add(r.from)});return [...s]}
function incomingReqs(){return friendReqs().filter(r=>r.to===S.uid&&r.status==='pending'&&player(r.from))}
function outgoingReqs(){return friendReqs().filter(r=>r.from===S.uid&&r.status==='pending'&&player(r.to))}
function notifCount(){return myInvites().length+incomingReqs().length}
function avColor(uid){return AV_COLORS[hashStr(uid)%AV_COLORS.length]}
function avatar(uid,name,cls='',style=''){
 const p=uid?player(uid):null;const n=name||nameOf(uid);
 if(p&&p.photo)return `<span class="av ${cls}" style="${style}" aria-hidden="true"><img src="${p.photo}" alt=""></span>`;
 return `<span class="av ${cls}" style="background:${avColor(uid||n)};${style}" aria-hidden="true">${esc((n[0]||'?').toUpperCase())}</span>`}
function firstPhoto(pin){const p=postsAt(pin).find(p=>p.photo&&!isHidden(p));return p?p.photo:null}
function heroPhotos(p){const a=[];if(p.cover)a.push(p.cover);postsAt(p.id).forEach(x=>{if(!isHidden(x))x.photos.forEach(ph=>a.push(ph))});return a}
function likeCount(post){return likesOf(post).length}
function pinLikes(pin){return postsAt(pin).reduce((n,x)=>n+likeCount(x.id),0)}
function canDelete(rec){return !!rec&&!!S.uid&&rec.by===S.uid}

/* ---------- stats, challenges, badges ---------- */
function statsFor(uid){
 const posts=allPosts().filter(p=>p.by===uid);
 const myPostIds=new Set(posts.map(p=>p.id));
 const likes=Object.values(D.likes||{}).filter(l=>myPostIds.has(l.post)&&l.uid!==uid).length;
 const likesGiven=Object.values(D.likes||{}).filter(l=>l.uid===uid&&!myPostIds.has(l.post)).length;
 const mediaStories=posts.filter(p=>p.photo||p.video).length;
 const unlocked=unlockedList(uid);
 const created=pinsList().filter(p=>p.by===uid).length;
 let first=0;for(const pin of pinsList()){const ps=postsAt(pin.id);if(ps.length&&ps[0].by===uid)first++}
 const group=unlocked.filter(u=>u.group).length;
 const total=pinsList().length;
 return {posts:posts.length,likes,helpful:likes,likesGiven,mediaStories,unlocked:unlocked.length,created,first,group,total};
}
const CHALLENGES=[
 {id:'explorer',name:'Local Explorer',desc:'Unlock 3 spots on the map.',icon:'mountain',target:3,val:s=>s.unlocked},
 {id:'storyteller',name:'Storyteller',desc:'Share 3 stories.',icon:'landmark',target:3,val:s=>s.posts},
 {id:'loved',name:'Well Loved',desc:'Get 5 likes on your stories.',icon:'heart',target:5,val:s=>s.likes},
 {id:'listener',name:'Good Listener',desc:'Like 5 stories by other people.',icon:'star',target:5,val:s=>s.likesGiven},
 {id:'photographer',name:'Photographer',desc:'Add a photo or video to 2 stories.',icon:'camera',target:2,val:s=>s.mediaStories},
 {id:'trail',name:'Trailblazer',desc:'Drop a new pin with a spare QR code.',icon:'pin',target:1,val:s=>s.created},
 {id:'first',name:'First Storyteller',desc:'Be the first to share a story at a spot.',icon:'crown',target:1,val:s=>s.first},
 {id:'buddy',name:'Walk Buddy',desc:'Unlock a spot together on a group walk.',icon:'users',target:1,val:s=>s.group},
 {id:'complete',name:'Explorer',desc:'Unlock every spot on the map.',icon:'explore',target:0,val:s=>s.unlocked}
];
function chalTarget(c,s){return c.id==='complete'?Math.max(s.total,1):c.target}
function earned(uid){const s=statsFor(uid);return CHALLENGES.filter(c=>c.val(s)>=chalTarget(c,s)&&(c.id!=='complete'||s.total>0)).map(c=>c.id)}

/* ---------- player writes (serialized) ---------- */
let pq=Promise.resolve();
function savePlayer(patch){
 S.me={...(S.me||{}),...patch};
 const snapshot=JSON.parse(JSON.stringify(S.me));
 pq=pq.then(()=>Store.set('players',S.uid,snapshot)).catch(()=>{toast('Couldn’t save your progress. Check your connection.')});
 schedule();
 return pq;
}

/* ---------- render scheduling ---------- */
let rq=false;
function schedule(){if(rq)return;rq=true;requestAnimationFrame(()=>{rq=false;renderAll()})}
const STATIC_VIEWS=['addpin'];
function renderAll(){
 if(!S.ready)return;
 if(!S.me&&Store.loaded.players&&!S.onb){S.onb='name';renderOnb()}
 if(S.me&&!S.me.onboarded&&!S.onb){S.onb='steps';renderOnb()}
 if(S.onb)return;
 renderTop();renderTabs();
 if(!STATIC_VIEWS.includes(S.view)&&!(S.arrive&&S.view==='map'&&$('#view .mapsvg')))renderView();
 if(S.pin)renderPin();
 if(S.modal&&S.modal.live)renderModal();
 checkBadges();
 checkGroupUnlocks();
 checkWalkEnded();
 if(S.pendingScan&&Store.loaded.pins&&!S.arrive&&!S.splash){const c=S.pendingScan;S.pendingScan=null;scan(c)}
}
function checkWalkEnded(){
 const g=groupId();if(!g||!Store.loaded.groups||!S.me||!S.me.onboarded)return;
 if(!(D.groups||{})[g]){if(S.endedWalk===g)return;S.endedWalk=g;savePlayer({groupId:null});toast('Your group walk ended because everyone else left.',3200)}
}
function checkGroupUnlocks(){
 const g=groupId();if(!g||!S.me||!S.me.onboarded||S.splash||S.arrive)return;
 const gm=groupMembers(g);if(gm.length<2)return;
 S.autoU=S.autoU||new Set();
 const by={};Object.values(D.scans||{}).forEach(x=>{if(x.group===g)(by[x.pin]||(by[x.pin]=new Set())).add(x.uid)});
 for(const pin in by){
  if(S.autoU.has(pin)||isUnlocked(pin)||!pinById(pin)||!by[pin].has(S.uid))continue;
  if(gm.every(m=>by[pin].has(m.id))){S.autoU.add(pin);setTimeout(()=>{closeModal();unlock(pin,{group:true});toast('Unlocked together with your group!')},0);break}
 }
}
function checkBadges(){
 if(!S.uid||!Store.loaded.likes||!Store.loaded.posts)return;
 const now=earned(S.uid);
 if(S.seenBadges===null){let saved=null;try{saved=JSON.parse(localStorage.getItem('em-badges-'+S.uid)||'null')}catch(e){}S.seenBadges=new Set(saved||now)}
 const fresh=now.filter(b=>!S.seenBadges.has(b));
 if(fresh.length){fresh.forEach(b=>S.seenBadges.add(b));const c=CHALLENGES.find(x=>x.id===fresh[0]);toast('Badge earned: '+c.name,3200)}
 try{localStorage.setItem('em-badges-'+S.uid,JSON.stringify([...S.seenBadges]))}catch(e){}
}

/* ---------- map zoom & pan ---------- */
const MAPBASE={x:-10,y:-6,w:380,h:552};const MINW=95;
function mv(){return S.mapView||MAPBASE}
function zoomed(){return !!S.mapView&&S.mapView.w<MAPBASE.w-0.5}
function clampView(v){
 const w=Math.max(MINW,Math.min(MAPBASE.w,v.w));const h=w*MAPBASE.h/MAPBASE.w;
 const x=Math.max(MAPBASE.x,Math.min(MAPBASE.x+MAPBASE.w-w,v.x));const y=Math.max(MAPBASE.y,Math.min(MAPBASE.y+MAPBASE.h-h,v.y));
 return {x,y,w,h};
}
function applyView(){
 const svg=$('#mapsvg');if(!svg)return;const v=mv();
 svg.setAttribute('viewBox',`${v.x} ${v.y} ${v.w} ${v.h}`);
 const k=v.w/MAPBASE.w;
 svg.querySelectorAll('.pin').forEach(g=>g.setAttribute('transform',`translate(${g.dataset.x},${g.dataset.y})${k!==1?` scale(${k})`:''}`));
 const r=document.querySelector('[data-act="zoomReset"]');if(r)r.hidden=!zoomed();
}
function zoomAt(f,cx,cy){
 const v=mv();const w=v.w/f;
 const nv=clampView({x:cx-(cx-v.x)*(w/v.w),y:cy-(cy-v.y)*(w/v.w),w});
 S.mapView=nv.w>=MAPBASE.w-0.5?null:nv;applyView();
}
function unitsPerPx(svg,v){return Math.max(v.w/svg.clientWidth,v.h/svg.clientHeight)}
function toSvg(svg,cx,cy){const pt=svg.createSVGPoint();pt.x=cx;pt.y=cy;return pt.matrixTransform(svg.getScreenCTM().inverse())}
function bindMap(){
 const svg=$('#mapsvg');if(!svg||svg.dataset.bound)return;svg.dataset.bound='1';
 const pts=new Map();let g=null;
 const begin=()=>{
  const v={...mv()};const a=[...pts.values()];
  if(a.length===1)g={mode:'pan',v,sx:a[0].x,sy:a[0].y};
  else if(a.length>=2){const[m,n]=a;const mid={x:(m.x+n.x)/2,y:(m.y+n.y)/2};const p=toSvg(svg,mid.x,mid.y);
   g={mode:'pinch',v,d:Math.hypot(m.x-n.x,m.y-n.y)||1,mid,fx:(p.x-v.x)/v.w,fy:(p.y-v.y)/v.h,px:p.x,py:p.y}}
 };
 const move=e=>{
  if(!pts.has(e.pointerId))return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});if(!g)return;
  const a=[...pts.values()];
  if(g.mode==='pan'&&a.length===1){
   const dx=a[0].x-g.sx,dy=a[0].y-g.sy;if(Math.abs(dx)+Math.abs(dy)>6)S.mapMoved=true;
   if(!S.mapMoved)return;const u=unitsPerPx(svg,g.v);
   const nv=clampView({x:g.v.x-dx*u,y:g.v.y-dy*u,w:g.v.w});S.mapView=nv.w>=MAPBASE.w-0.5&&nv.x===MAPBASE.x&&nv.y===MAPBASE.y?null:nv;applyView();
  }else if(g.mode==='pinch'&&a.length>=2){
   S.mapMoved=true;const[m,n]=a;const d=Math.hypot(m.x-n.x,m.y-n.y)||1;const mid={x:(m.x+n.x)/2,y:(m.y+n.y)/2};
   const w=g.v.w/(d/g.d);const h=w*MAPBASE.h/MAPBASE.w;const u=Math.max(w/svg.clientWidth,h/svg.clientHeight);
   const nv=clampView({x:g.px-g.fx*w-(mid.x-g.mid.x)*u,y:g.py-g.fy*h-(mid.y-g.mid.y)*u,w});
   S.mapView=nv.w>=MAPBASE.w-0.5?null:nv;applyView();
  }
 };
 const end=e=>{
  if(!pts.has(e.pointerId))return;pts.delete(e.pointerId);
  if(pts.size){begin();return}
  window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',end);window.removeEventListener('pointercancel',end);
  if(S.mapMoved)S.mapDragAt=Date.now();
  g=null;S.mapGesture=false;S.mapMoved=false;
  if(S.mapDirty){S.mapDirty=false;setTimeout(renderView,0)}
 };
 svg.addEventListener('pointerdown',e=>{
  if(e.pointerType==='mouse'&&e.button!==0)return;
  if(!pts.size){S.mapMoved=false;window.addEventListener('pointermove',move);window.addEventListener('pointerup',end);window.addEventListener('pointercancel',end)}
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});S.mapGesture=true;begin();
 });
 svg.addEventListener('wheel',e=>{e.preventDefault();const p=toSvg(svg,e.clientX,e.clientY);zoomAt(e.deltaY<0?1.18:1/1.18,p.x,p.y)},{passive:false});
 svg.addEventListener('click',e=>{
  if(!S.placing||Date.now()-(S.mapDragAt||0)<350)return;
  e.stopPropagation();const p=toSvg(svg,e.clientX,e.clientY);
  S.addForm.x=Math.max(10,Math.min(350,Math.round(p.x)));S.addForm.y=Math.max(30,Math.min(530,Math.round(p.y)));
  S.placing=false;go('addpin');
 });
 svg.addEventListener('dblclick',e=>{e.preventDefault();const p=toSvg(svg,e.clientX,e.clientY);zoomAt(zoomed()&&mv().w<=MINW+1?1/4:2,p.x,p.y)});
}

/* shared feed controls: sort, who, tags. scope = 'feed' (all stories) or 'pin' (one spot) */

 return `<div class="feedbar">
   <div class="miniseg" role="group" aria-label="Whose stories">${[['all','Everyone'],['friends','Friends']].map(([k,l])=>`<button data-act="feedWho" data-scope="${scope}" data-k="${k}" aria-pressed="${F.who===k}">${l}</button>`).join('')}</div>
   <button class="filterbtn ${active?'on':''}" data-act="openFilters" data-scope="${scope}" aria-label="Filter and sort${active?', '+active+' active':''}">${ic('filter',16,1.8)} Filter${active?`<span class="fcount">${active}</span>`:''}</button>
  </div>
  ${active?`<p class="tiny muted" style="margin:8px 2px 0">${[F.sort==='new'?'Newest first':'',F.tag!=='all'?TAGS[F.tag].label:''].filter(Boolean).join(' • ')} <button class="linkbtn" data-act="clearFilters" data-scope="${scope}" style="font-size:11px;margin-left:4px">Clear</button></p>`:''}`;
}
function feedState(scope){S.feeds=S.feeds||{};return S.feeds[scope]||(S.feeds[scope]={sort:'likes',who:'all',tag:'all'})}
function filterStories(list,scope){
 const F=feedState(scope);const fr=new Set(friendIds());
 let L=list.filter(x=>!isHidden(x)&&pinById(x.pin));
 if(F.tag!=='all')L=L.filter(x=>x.tags.includes(F.tag));
 if(F.who==='friends')L=L.filter(x=>fr.has(x.by));
 const lk=x=>likeCount(x.id);
 L.sort(F.sort==='new'?(a,b)=>(b.at||0)-(a.at||0):(a,b)=>lk(b)-lk(a)||(b.at||0)-(a.at||0));
 return L;
}
function feedList(list,scope){

 if(!L.length)return `<p class="muted small" style="padding:22px 4px">${feedState(scope).who==='friends'?'None of your friends have shared a story here yet.':'No stories match yet.'}</p>`;

}
/* A sneak-peek card: headline + what it's about + teaser media, never the full story. */

async function startCamera(){
 const st=()=>$('#scanstatus');const v=$('#scanvideo');
 const fail=msg=>{if(st())st().textContent=msg};
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){fail('This browser can’t use the camera here. Use test mode below.');return}
 try{
  const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});
  if(!S.page||S.page.type!=='scan'){stream.getTracks().forEach(t=>t.stop());return}
  S.cam=stream;v.srcObject=stream;await v.play();
  $('#scanbox').classList.add('live');fail('Point your camera at a spot’s QR code.');
  const det=('BarcodeDetector' in window)?new BarcodeDetector({formats:['qr_code']}):null;
  const cv=$('#scancanvas');const ctx=cv.getContext('2d',{willReadFrequently:true});
  const tick=async()=>{
   if(!S.cam)return;
   try{
    let text=null;
    if(det){const r=await det.detect(v);if(r&&r[0])text=r[0].rawValue}
    else if(window.jsQR&&v.videoWidth){cv.width=Math.min(640,v.videoWidth);cv.height=Math.round(cv.width*v.videoHeight/v.videoWidth);ctx.drawImage(v,0,0,cv.width,cv.height);const r=jsQR(ctx.getImageData(0,0,cv.width,cv.height).data,cv.width,cv.height);if(r)text=r.data}
    if(text){const code=String(text).split('#').pop().trim().toLowerCase();if(pinById(code)||/^spare\d+$/.test(code)){finishScan(code);return}fail('That QR code isn’t one of this room’s spots.')}
   }catch(e){}
   S.camLoop=setTimeout(tick,250);
  };
  tick();
 }catch(e){fail(e&&e.name==='NotAllowedError'?'Camera access is blocked. Use test mode below, or open the QR link with your phone’s camera app.':'The camera isn’t available here. Use test mode below, or your phone’s camera app.')}
}

function readHash(){const h=decodeURIComponent((location.hash||'').slice(1)).trim().toLowerCase();if(!h)return;try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}return h}
function scan(code){
 code=String(code||'').trim().toLowerCase().replace(/^#/,'');
 if(!code)return;
 if(S.onb||!S.me||!S.me.onboarded||!Store.loaded.pins){S.pendingScan=code;return}
 const p=pinById(code);
 if(!p){
  if(/^spare\d+$/.test(code)&&Number(code.slice(5))<=spareCount()){openModal({type:'spare',spare:code});return}
  toast('That code doesn’t match a spot on the map.');return;
 }
 closePinLayer();closePage();
 if(isUnlocked(p.id)){openPin(p.id);toast('You’ve already unlocked '+p.name+'.');return}
 const g=groupId();const gm=groupMembers(g);
 if(g&&gm.length>1){
  Store.set('scans',safeSeg(g+'_'+p.id+'_'+S.uid),{group:g,pin:p.id,uid:S.uid,at:Date.now()}).catch(()=>toast('Couldn’t record your scan. Try again.'));
  openModal({type:'groupwait',pin:p.id,live:true});return;
 }

}

}

 sfPick(){const i=$('#sf-photo');if(i)i.click()},
 sfClear(el){const f=storyForm();if(!f)return;f.photos.splice(+el.dataset.i,1);redrawStoryForm(f)},
 sfTeaser(el){const f=storyForm();if(!f||el.disabled)return;f.teaser=el.dataset.k;f.teaserTouched=true;redrawStoryForm(f)},
 async delStory(el){const x=(D.posts||{})[el.dataset.id];if(!x||!canDelete(x))return;if(!confirm('Delete this story? This can’t be undone.'))return;
  try{await Store.del('posts',el.dataset.id);Object.entries(D.likes||{}).filter(([k,l])=>l.post===el.dataset.id).forEach(([k])=>Store.del('likes',k).catch(()=>{}));Object.entries(D.replies||{}).filter(([k,r])=>r.post===el.dataset.id).forEach(([k])=>Store.del('replies',k).catch(()=>{}));if(x.video&&Store.sb){const m=String(x.video).split('/media/')[1];if(m)Store.sb.storage.from('media').remove([decodeURIComponent(m)]).catch(()=>{})}toast('Story deleted')}catch(e){toast('Couldn’t delete that. Check your connection.')}},
 async delPin(el){const p=pinById(el.dataset.id);if(!p||!canDelete(p))return;const n=postsAt(p.id).length;if(!confirm(`Delete “${p.name}” and its ${n} ${n===1?'story':'stories'}? This can’t be undone.`))return;
  try{for(const x of postsAt(p.id))await Store.del('posts',x.id);await Store.del('pins',p.id);closePinLayer();go('map');toast('Pin deleted'+(/^spare\d+$/.test(p.id)?'. Its QR code is free to reuse.':''))}catch(e){toast('Couldn’t delete that. Check your connection.')}},
 delReply(el){const r=(D.replies||{})[el.dataset.id];if(!r||r.by!==S.uid)return;Store.del('replies',el.dataset.id).catch(()=>toast('Couldn’t delete that.'))},
 viewPhoto(el){openViewer(el.dataset.id,el.dataset.i)},
 closeViewer(){closeViewer()},
 viewerStep(el){const V=S.viewer;if(!V)return;const k=Math.max(0,Math.min(V.n-1,V.i+(+el.dataset.d)));const st=$('#vstrip');st.scrollTo({left:k*st.clientWidth,behavior:'smooth'})},
 allBadges(){S.allBadges=!S.allBadges;renderView()},
 actTab(el){const o=['stories','liked','comments'];const cur=S.actTab||'stories';if(el.dataset.k===cur)return;S.actDir=o.indexOf(el.dataset.k)>o.indexOf(cur)?'slide-r':'slide-l';S.actTab=el.dataset.k;renderView();S.actDir=null},
 onbPhoto(){const i=$('#onb-file');if(!i)return;i.onchange=async()=>{const f=i.files&&i.files[0];if(!f)return;const v=$('#uname').value;try{S.onbPhoto=await compress(f,240);S.onbFirst=false;renderOnb();$('#uname').value=v}catch(e){toast('That photo couldn’t be read.')}};i.click()},
 pickAvatar(){const i=$('#av-file');if(!i)return;i.onchange=async()=>{const f=i.files&&i.files[0];if(!f)return;try{const d=await compress(f,240);savePlayer({photo:d});toast('Profile photo updated')}catch(e){toast('That photo couldn’t be read.')}};i.click()},
 openScan(el){closeModal();openScan(el.dataset.id||null)},
 submitScanCode(){const v=($('#scancode').value||'').trim().toLowerCase().replace(/^#/,'');if(!v){$('#scan-err').textContent='Type the code printed under the QR code.';return}if(!pinById(v)&&!/^spare\d+$/.test(v)){$('#scan-err').textContent='No spot has that code. Check the spelling.';return}finishScan(v)},
 simScan(el){finishScan(el.dataset.id)},
 guess(el){
  const p=pinById(el.dataset.id);const v=($('#guess').value||'').trim().toLowerCase();
  if(!v){$('#guess-err').textContent='Type a guess first.';return}
  if((p.guess||[]).some(g=>v.includes(String(g).toLowerCase()))){savePlayer({guesses:{...(S.me.guesses||{}),[p.id]:true}});toast('You got it! Plant Detective points earned.');renderModal()}
  else{$('#guess-err').textContent='Not quite. Unlock the spot to find out.'}
 },
 compose(el){closeModal();openCompose(el.dataset.id)},
 pickPhoto(el){const i=$('#'+el.dataset.p+'-file');if(i)i.click()},
 clearPhoto(el){const st=el.dataset.p==='pf'?S.addForm:S.page.form;st.photo=null;st._show&&st._show()},
 async submitPost(el){
  const pg=S.page;const f=pg.form;const err=$('#c-err');
  const miss=readStoryForm(f);if(miss){err.textContent=miss;return}
  el.disabled=true;el.textContent='Posting…';
  try{const rec=await storyRecord(f,pg.pin);const id=newId();await Store.set('posts',id,rec);closePage();toast('Story shared at '+(pinById(pg.pin)||{}).name);S.scrollStory=id;openPin(pg.pin)}
  catch(e){console.error(e);el.disabled=false;el.textContent='Post story';err.textContent=(e&&/large|size|limit|exceed/i.test(String(e.message||e)))?'Those photos are too big together. Try fewer photos.':'Couldn’t post. Try fewer photos or check your connection.'}
 },
 like(el){const id=el.dataset.id;const k=safeSeg(id+'_'+S.uid);const post=(D.posts||{})[id];if((D.likes||{})[k])Store.del('likes',k).catch(()=>{});else Store.set('likes',k,{post:id,uid:S.uid,author:post&&post.by||'',at:Date.now()}).catch(()=>toast('Couldn’t save your reaction.'))},
 reply(el){openModal({type:'reply',post:el.dataset.id,autofocus:true})},
 async submitReply(el){
  const t=($('#rtext').value||'').trim();const err=$('#r-err');
  if(!t){err.textContent='Write something to add.';return}
  if(hasProfanity(t)){err.textContent='That includes a word that isn’t allowed. Remove it to post.';return}
  el.disabled=true;try{await Store.set('replies',newId(),{post:S.modal.post,text:t,by:S.uid,at:Date.now()});closeModal();toast('Added')}catch(e){el.disabled=false;err.textContent='Couldn’t add that. Check your connection.'}
 },
 addMenu(){openModal({type:'addMenu'})},
 pickSpot(){openModal({type:'pickSpot',autofocus:true,after:()=>{const i=$('#spotq');if(i)i.addEventListener('input',()=>{$('#spotlist').innerHTML=spotListHtml(i.value)})}})},
 startPin(){if(!freeSpares().length){toast('All spare QR codes are in use.');return}closeModal();S.addForm={teaser:'text',tags:[]};startPlacing()},
 movePin(){startPlacing()},
 cancelPlace(){S.placing=false;S.addForm={};renderView()},
 cancelPin(){S.addForm={};go('map')},
 claimSpare(el){closeModal();S.addForm={teaser:'text',tags:[],spare:el.dataset.id};startPlacing()},
 placePin(el,ev){const svg=$('#pf-map');const pt=svg.createSVGPoint();pt.x=ev.clientX;pt.y=ev.clientY;const q=pt.matrixTransform(svg.getScreenCTM().inverse());S.addForm.x=Math.max(10,Math.min(350,Math.round(q.x)));S.addForm.y=Math.max(30,Math.min(530,Math.round(q.y)));drawPfMarker()},
 async submitPin(el){
  const f=S.addForm;const err=$('#pf-err');
  const ne=$('#pf-name');if(ne)f.name=ne.value.trim();
  const sp=$('#pf-spare');if(sp)f.spare=sp.value;
  const miss=!f.name?'Give your pin a name.':f.x==null?'Place your pin on the map.':!f.spare?'Pick a spare QR code.':readStoryForm(f);
  if(miss){err.textContent=miss;return}
  if(hasProfanity(f.name)){err.textContent='The spot name includes a word that isn’t allowed.';return}
  if(pinById(f.spare)){err.textContent='Someone just claimed that QR code. Pick another.';return}
  el.disabled=true;el.textContent='Dropping pin…';
  try{
   const id=f.spare;
   const rec=await storyRecord(f,id);
   await Store.set('pins',id,{name:f.name,x:f.x,y:f.y,by:S.uid,at:Date.now()});
   await Store.set('posts',newId(),rec);
   savePlayer({unlocked:[...unlockedList(S.uid),{pin:id,at:Date.now()}]});
   S.addForm={};S.fresh=id;S.mapMode='map';go('map');
   openModal({type:'pinDropped',spare:id});
  }catch(e){console.error(e);el.disabled=false;el.textContent='Drop pin';err.textContent='Couldn’t drop the pin. Try fewer photos or check your connection.'}
 },
 async startGroup(){const g=newId();try{await Store.set('groups',g,{leader:S.uid,at:Date.now()});await savePlayer({groupId:g});toast('Walk started. Invite friends to join.')}catch(e){toast('Couldn’t start a walk. Try again.')}},
 leaveGroup(){
  const g=groupId();if(!g)return;
  const rest=groupMembers(g).filter(m=>m.id!==S.uid);
  savePlayer({groupId:null});
  if(rest.length<=1){Store.del('groups',g).catch(()=>{});toast(rest.length?'You left, so the walk ended.':'Walk ended.')}
  else toast('You left the group walk.');
 },
 inviteUser(el){sendInviteTo(el.dataset.id)},
 acceptInvite(el){const i=(D.invites||{})[el.dataset.id];if(!i)return;Store.set('invites',el.dataset.id,{...i,status:'accepted'}).catch(()=>{});savePlayer({groupId:i.group});closeModal();toast('You joined @'+nameOf(i.from)+'’s walk.')},
 declineInvite(el){const i=(D.invites||{})[el.dataset.id];if(!i)return;Store.set('invites',el.dataset.id,{...i,status:'declined'}).catch(()=>{})},
 addFriend(){openModal({type:'addFriend',autofocus:true})},
 submitFriend(){
  const n=($('#fname').value||'').trim().replace(/^@/,'').toLowerCase();const err=$('#f-err');
  const t=players().find(p=>p.username.toLowerCase()===n);
  if(!t){err.textContent='No one has that username yet.';return}
  if(t.id===S.uid){err.textContent='That’s you.';return}
  const r=reqWith(t.id);
  if(r&&r.status==='accepted'){err.textContent='You’re already friends.';return}
  if(r&&r.status==='pending'&&r.from===S.uid){err.textContent='Request already sent. Waiting for them to accept.';return}
  const status=(r&&r.status==='pending'&&r.to===S.uid)?'accepted':'pending';
  Store.set('friendreqs',pairId(S.uid,t.id),status==='accepted'?{...r,status,at:Date.now()}:{from:S.uid,to:t.id,status,at:Date.now()})
   .then(()=>{closeModal();toast(status==='accepted'?'You and @'+t.username+' are now friends':'Friend request sent to @'+t.username)}).catch(()=>{err.textContent='Couldn’t send that. Check your connection.'});
 },
 acceptFriend(el){const r=reqWith(el.dataset.id);if(!r)return;Store.set('friendreqs',pairId(S.uid,el.dataset.id),{...r,status:'accepted',at:Date.now()}).then(()=>toast('You and @'+nameOf(el.dataset.id)+' are now friends')).catch(()=>toast('Couldn’t accept. Try again.'))},
 declineFriend(el){const r=reqWith(el.dataset.id);if(!r)return;Store.set('friendreqs',pairId(S.uid,el.dataset.id),{...r,status:'declined',at:Date.now()}).catch(()=>toast('Couldn’t decline. Try again.'))},
 cancelFriend(el){Store.del('friendreqs',pairId(S.uid,el.dataset.id)).catch(()=>toast('Couldn’t cancel. Try again.'))},
 qr(){openModal({type:'qr',after:drawQRs})},
 print(){try{window.print()}catch(e){toast('Printing isn’t available here. Take a screenshot instead.')}},
 async saveCfg(){const c={...cfg(),baseUrl:$('#q-base').value.trim(),spares:Math.max(0,Math.min(12,Number($('#q-sp').value)||0)),labels:{top:$('#q-top').value.trim()||'Top',bottom:$('#q-bottom').value.trim()||'Bottom',left:$('#q-left').value.trim()||'Left',right:$('#q-right').value.trim()||'Right'}};try{await Store.set('config','main',c);toast('Settings saved');renderModal();S.modal&&S.modal.after&&S.modal.after()}catch(e){toast('Couldn’t save settings.')}},
 async submitName(el){
  const v=($('#uname').value||'').trim().replace(/^@/,'');const err=$('#u-err');
  if(!/^[A-Za-z0-9_]{3,20}$/.test(v)){err.textContent='Use 3 to 20 letters, numbers or underscores.';return}
  if(hasProfanity(v)){err.textContent='Pick a different username.';return}
  if(players().some(p=>p.id!==S.uid&&p.username.toLowerCase()===v.toLowerCase())){err.textContent='Someone already has that name. Try another.';return}
  el.disabled=true;
  S.me={username:v,unlocked:[],friends:[],guesses:{},groupId:null,onboarded:false,at:Date.now()};if(S.onbPhoto)S.me.photo=S.onbPhoto;
  try{await savePlayer({});rememberAccount();S.onb='steps';S.onbSlide=true;renderOnb();S.onbSlide=false}catch(e){el.disabled=false;err.textContent='Couldn’t save. Check your connection.'}
 },
 finishOnb(){savePlayer({onboarded:true});S.onb=null;reveal()},
 continueSplash(){if(S.splash){S.splash=null;reveal()}}
};
function startPlacing(){
 S.placing=true;S.mapMode='map';go('map');
 // zoom in a little so it's easier to aim
 if(!zoomed()){const v=mv();zoomAt(1.5,v.x+v.w/2,v.y+v.h/2)}
}
function storyForm(){return S.view==='addpin'?S.addForm:(S.page&&S.page.type==='compose'?S.page.form:null)}
function rerenderFeed(scope,anim){
 S.listAnim=anim==='fade'?'fadein':anim;
 if(scope==='pin'){renderPin()}else{renderView()}
 S.listAnim=null;
}
// Keep video teasers to their first few seconds.
document.addEventListener('timeupdate',e=>{const v=e.target;if(v&&v.dataset&&v.dataset.clip&&v.currentTime>+v.dataset.clip)v.currentTime=0},true);
function sendInviteTo(uid){
 (async()=>{let g=groupId();if(!g){g=newId();await Store.set('groups',g,{leader:S.uid,at:Date.now()});await savePlayer({groupId:g})}
  await Store.set('invites',newId(),{from:S.uid,to:uid,group:g,status:'pending',at:Date.now()});toast('Walk invite sent to @'+nameOf(uid))})().catch(()=>toast('Couldn’t send the invite.'));
}
function drawQRs(){document.querySelectorAll('[data-qr]').forEach(el=>{el.innerHTML='';if(typeof QRCode==='undefined'){el.textContent='QR library didn’t load. Use the code below.';return}try{new QRCode(el,{text:el.dataset.qr,width:140,height:140,colorDark:'#0A3600',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M})}catch(e){el.textContent='Couldn’t draw this code.'}})}

document.addEventListener('click',ev=>{
 const el=ev.target.closest('[data-act]');if(!el)return;
 const fn=ACT[el.dataset.act];if(!fn)return;
 if(el.dataset.act==='scrim'&&ev.target!==el)return;
 ev.preventDefault();fn(el,ev);
});
document.addEventListener('keydown',ev=>{
 if(ev.key==='Escape'&&S.viewer){closeViewer();return}
 if(S.viewer&&(ev.key==='ArrowRight'||ev.key==='ArrowLeft')){ACT.viewerStep({dataset:{d:ev.key==='ArrowRight'?1:-1}});return}
 if(ev.key==='Escape'&&S.modal&&!S.modal.noclose)closeModal();
 if(ev.key==='Enter'&&ev.target.matches('.pin')){ev.preventDefault();ACT.pinTap(ev.target)}
 if(ev.key==='Enter'&&ev.target.matches('input.field')){const map={uname:'submitName',scancode:'submitScanCode',fname:'submitFriend'};const a=map[ev.target.id];if(a){ev.preventDefault();ACT[a]($('[data-act="'+a+'"]')||ev.target,ev)}else if(ev.target.id==='guess'){ev.preventDefault();$('[data-act="guess"]').click()}}
});
window.addEventListener('hashchange',()=>{const h=readHash();if(h)scan(h)});

/* ---------- boot ---------- */
(async function boot(){
 S.pendingScan=readHash()||null;
 Store.loadLocal();
 // Host tools (map labels, spare-code count) unlock on a phone that once opened the app with ?host at the end of the link.
 try{if(new URLSearchParams(location.search).has('host'))localStorage.setItem('em-host','1');S.isOwner=localStorage.getItem('em-host')==='1'}catch(e){}
 try{S.uid=localStorage.getItem('em-active')||localStorage.getItem('em-uid')}catch(e){}
 if(!S.uid){S.uid='u-'+newId();try{localStorage.setItem('em-uid',S.uid)}catch(e){}}
 S.canWrite=true;
 await Store.init();
 const mine=(D.players||{})[S.uid];if(mine)S.me={...mine};
 rememberAccount();
 S.ready=true;renderBanner();
 if(!S.me){S.onb='name';renderOnb();renderAll()}else if(!S.me.onboarded){S.onb='steps';renderOnb();renderAll()}else{showSplash()}
})();
</script>
</body>
</html>
